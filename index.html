<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Launcher</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="img/logo.png">
</head>

<body>
    <div class="logo">
        <img src="img/title.png" width="800">
    </div>

    <div class="launcher">
        <div class="title"> <img src="img/google/google.png" alt="">
            <h2>Google Workspace</h2>
        </div>
        <div class="shortcuts">
            <a href="https://docs.google.com" target="_blank" class="shortcut">
                <div><img src="img/google/docs.png" alt=""><br>
                    <p>Docs</p>
                </div>
            </a>
            <a href="https://sheets.google.com" target="_blank" class="shortcut">
                <div><img src="img/google/sheets.png" alt=""><br>
                    <p>Sheets</p>
                </div>
            </a>
            <a href="https://slides.google.com" target="_blank" class="shortcut">
                <div><img src="img/google/slides.png" alt=""><br>
                    <p>Slides</p>
                </div>
            </a>
            <a href="https://drive.google.com" target="_blank" class="shortcut">
                <div><img src="img/google/drive.png" alt=""><br>
                    <p>Drive</p>
                </div>
            </a>
            <a href="https://gemini.google.com" target="_blank" class="shortcut">
                <div><img src="img/google/gemini.png" alt=""><br>
                    <p>Gemini</p>
                </div>
            </a>
        </div>
    </div>

    <div class="launcher">
        <div class="title"> <img src="img/microsoft/microsoft.png" alt="">
            <h2>Microsoft Office</h2>
        </div>
        <div class="shortcuts">
            <a href="https://word.cloud.microsoft/" target="_blank" class="shortcut">
                <div><img src="img/microsoft/word.png" alt=""><br>
                    <p>Word</p>
                </div>
            </a>
            <a href="https://excel.cloud.microsoft/" target="_blank" class="shortcut">
                <div><img src="img/microsoft/excel.png" alt=""><br>
                    <p>Excel</p>
                </div>
            </a>
            <a href="https://powerpoint.cloud.microsoft/" target="_blank" class="shortcut">
                <div><img src="img/microsoft/powerpoint.png" alt=""><br>
                    <p>PowerPoint</p>
                </div>
            </a>
            <a href="https://onedrive.live.com" target="_blank" class="shortcut">
                <div><img src="img/microsoft/onedrive.png" alt=""><br>
                    <p>Onedrive</p>
                </div>
            </a>
            <a href="https://copilot.microsoft.com" target="_blank" class="shortcut">
                <div><img src="img/microsoft/copilot.png" alt=""><br>
                    <p>Copilot</p>
                </div>
            </a>
        </div>
    </div>
</body>

</html>
